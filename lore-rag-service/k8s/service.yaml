apiVersion: v1
kind: Service
metadata:
  name: lore-rag
  namespace: ashiorid
  labels:
    app: lore-rag
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8002"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - port: 8002
    targetPort: 8002
    protocol: TCP
    name: http
  selector:
    app: lore-rag
