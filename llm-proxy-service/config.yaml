# LLM Proxy Service Configuration

service:
  name: llm-proxy-service
  port: 8001
  host: 0.0.0.0
  workers: 4
  reload: false  # Set to true for development

# LLM Providers
providers:
  openai:
    enabled: true
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1
    models:
      - gpt-4-turbo-preview
      - gpt-4
      - gpt-3.5-turbo
    default_model: gpt-3.5-turbo
    timeout: 120
    max_retries: 3

  anthropic:
    enabled: true
    api_key_env: ANTHROPIC_API_KEY
    base_url: https://api.anthropic.com
    models:
      - claude-3-opus-20240229
      - claude-3-sonnet-20240229
      - claude-3-haiku-20240307
    default_model: claude-3-haiku-20240307
    timeout: 120
    max_retries: 3

  ollama:
    enabled: true
    base_url: http://host.docker.internal:11434
    # For K8s, use service name if Ollama is deployed in cluster
    # base_url: http://ollama:11434
    models:
      - llama3.2:1b
      - llama3.2:3b
      - phi3:mini
      - nomic-embed-text
    default_model: llama3.2:3b
    timeout: 120
    max_retries: 3

# Default provider selection
default_provider: ollama

# Request batching
batching:
  enabled: true
  max_batch_size: 10
  max_wait_ms: 100

# Caching
cache:
  enabled: true
  backend: redis
  ttl: 3600  # 1 hour
  max_size: 10000

# Rate limiting
rate_limit:
  enabled: true
  requests_per_minute: 60
  burst: 10

# Cost tracking
cost_tracking:
  enabled: true
  # Cost per 1K tokens (approximate, update with current pricing)
  pricing:
    openai:
      gpt-4: {prompt: 0.03, completion: 0.06}
      gpt-4-turbo-preview: {prompt: 0.01, completion: 0.03}
      gpt-3.5-turbo: {prompt: 0.0005, completion: 0.0015}
    anthropic:
      claude-3-opus-20240229: {prompt: 0.015, completion: 0.075}
      claude-3-sonnet-20240229: {prompt: 0.003, completion: 0.015}
      claude-3-haiku-20240307: {prompt: 0.00025, completion: 0.00125}
    ollama:
      # Ollama is free (local), but track token usage
      default: {prompt: 0.0, completion: 0.0}

# Metrics
metrics:
  enabled: true
  port: 9090
  path: /metrics

# Health checks
health_check:
  enabled: true
  path: /health
  detailed_path: /health/detailed
