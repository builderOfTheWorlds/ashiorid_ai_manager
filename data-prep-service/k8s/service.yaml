apiVersion: v1
kind: Service
metadata:
  name: data-prep
  namespace: ashiorid
  labels:
    app: data-prep
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9096"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - port: 8006
    targetPort: 8006
    protocol: TCP
    name: http
  - port: 9096
    targetPort: 9096
    protocol: TCP
    name: metrics
  selector:
    app: data-prep
