# Prometheus configuration for Ashiorid AI Manager
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'llm-proxy'
    static_configs:
      - targets: ['llm-proxy:8001']

  - job_name: 'lore-rag'
    static_configs:
      - targets: ['lore-rag:8002']

  - job_name: 'character-agent'
    static_configs:
      - targets: ['character-agent:8003']

  - job_name: 'simulation-engine'
    static_configs:
      - targets: ['simulation-engine:8004']

  - job_name: 'ai-manager'
    static_configs:
      - targets: ['ai-manager:8005']
