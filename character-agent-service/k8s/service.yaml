apiVersion: v1
kind: Service
metadata:
  name: character-agent
  namespace: ashiorid
  labels:
    app: character-agent
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8003"
spec:
  type: ClusterIP
  ports:
  - port: 8003
    targetPort: 8003
    name: http
  selector:
    app: character-agent
